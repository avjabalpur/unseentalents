services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretwhiz
      POSTGRES_PASSWORD: secretwhiz
      POSTGRES_DB: secretwhiz
    ports:
      - "5433:5432"   # host 5433 -> avoids conflict with a native Postgres install on 5432
    volumes:
      - secretwhiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretwhiz -d secretwhiz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  secretwhiz_postgres_data:
